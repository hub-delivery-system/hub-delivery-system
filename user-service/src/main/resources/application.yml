server:
  port: 19020

spring:
  application:
    name: user-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hub_user}
    username: ${DB_USERNAME:hub}
    password: ${DB_PASSWORD:hub}

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

eureka:
  client:
    enabled: false

keycloak:
  base-url: ${KEYCLOAK_BASE_URL:http://localhost:8080}
  realm: ${KEYCLOAK_REALM:hub-delivery}
  client-id: ${KEYCLOAK_CLIENT_ID:hub-delivery-client}
  # 보안상 실제 secret은 환경변수로만 주입
  client-secret: ${KEYCLOAK_CLIENT_SECRET:}
