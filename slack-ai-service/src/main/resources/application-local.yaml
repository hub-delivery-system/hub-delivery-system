server:
  port: 19070

spring:
  application:
    name: slack-ai-service

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slack_ai_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me}

  jpa:
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: slack-ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:19090}/eureka/
    register-with-eureka: true
    fetch-registry: true

slack:
  bot:
    token: ${SLACK_BOT_TOKEN:test-token}

ai:
  gemini:
    api-key: ${AI_API_KEY:test-key}

naver:
  directions:
    client-id: ${NAVER_DIRECTIONS_CLIENT_ID:test-id}
    client-secret: ${NAVER_DIRECTIONS_CLIENT_SECRET:test-secret}
    base-url: https://naveropenapi.apigw.ntruss.com/map-direction/v1

scheduler:
  daily-alert:
    cron: "0 0 6 * * *"

kafka:
  topic:
    order-created: order.created

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    level: "%5p [${spring.application.name:}, traceId=%X{traceId:-}, spanId=%X{spanId:-}]"

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      enabled: false