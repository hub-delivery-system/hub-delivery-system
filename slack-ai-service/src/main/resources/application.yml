server:
  port: 19070

spring:
  application:
    name: slack-ai-service

  datasource:
    driver-class-name: org.postgresql.Driver
    # 기본값은 전체 MSA / Docker Compose 연동 기준입니다.
    # IntelliJ에서 전체 MSA를 로컬 포트로 붙일 경우 DB_URL 환경변수로 덮어쓰면 됩니다.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/slack_ai_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:change-me}

  jpa:
    database: postgresql
    # Hibernate 6에서는 dialect를 명시하지 않아도 자동 감지되지만,
    # 팀 기존 설정과의 호환성을 위해 유지합니다.
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        format_sql: true

  sql:
    init:
      mode: never

  kafka:
    # 전체 MSA / 로컬 Docker Compose에서는 보통 localhost:9092 사용.
    # Docker 컨테이너 내부에서 실행할 때는 환경변수로 kafka:29092 등을 주입합니다.
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: slack-ai-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "*"
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer

eureka:
  client:
    # 기본값은 전체 MSA 연동 기준이므로 Eureka 사용.
    enabled: ${EUREKA_CLIENT_ENABLED:true}
    register-with-eureka: ${EUREKA_REGISTER_WITH_EUREKA:true}
    fetch-registry: ${EUREKA_FETCH_REGISTRY:true}
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:19090}/eureka/

slack:
  bot:
    token: ${SLACK_BOT_TOKEN:test-token}

ai:
  gemini:
    api-key: ${AI_API_KEY:test-key}

naver:
  directions:
    client-id: ${NAVER_DIRECTIONS_CLIENT_ID:test-id}
    client-secret: ${NAVER_DIRECTIONS_CLIENT_SECRET:test-secret}
    base-url: https://naveropenapi.apigw.ntruss.com/map-direction/v1

scheduler:
  daily-alert:
    cron: "0 0 6 * * *"

kafka:
  topic:
    order-created: ${KAFKA_TOPIC_ORDER_CREATED:order.created}

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  pattern:
    # Zipkin/Micrometer tracing 확인용 로그 패턴.
    level: "%5p [${spring.application.name:}, traceId=%X{traceId:-}, spanId=%X{spanId:-}]"

management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0
  zipkin:
    tracing:
      # 기본은 꺼둠. Zipkin 서버까지 확인할 때 환경변수로 true 전환 가능.
      enabled: ${ZIPKIN_TRACING_ENABLED:false}
      endpoint: ${ZIPKIN_ENDPOINT:http://localhost:9411/api/v2/spans}
  endpoints:
    web:
      exposure:
        include: health,circuitbreakers
  health:
    circuitbreakers:
      enabled: true

resilience4j:
  circuitbreaker:
    instances:
      gemini:
        # 최근 10회 호출을 기준으로 실패율 계산.
        slidingWindowSize: 10
        # 실패율 50% 이상이면 Circuit Open.
        failureRateThreshold: 50
        # Open 상태 유지 후 Half-Open으로 전환되는 시간.
        waitDurationInOpenState: 30s
        # Half-Open 상태에서 허용할 테스트 호출 수.
        permittedNumberOfCallsInHalfOpenState: 3
        # 최소 5회 호출 이후부터 실패율 계산.
        minimumNumberOfCalls: 5
        recordExceptions:
          - java.lang.RuntimeException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      naver:
        slidingWindowSize: 10
        failureRateThreshold: 50
        waitDurationInOpenState: 20s
        permittedNumberOfCallsInHalfOpenState: 3
        minimumNumberOfCalls: 5
        recordExceptions:
          - java.lang.RuntimeException
          - org.springframework.web.client.ResourceAccessException
          - org.springframework.web.client.HttpServerErrorException

      slack:
        slidingWindowSize: 10
        # Slack 메시지 전송은 일시적 외부 장애가 있을 수 있어 Gemini보다 조금 관대하게 설정.
        failureRateThreshold: 60
        waitDurationInOpenState: 60s
        permittedNumberOfCallsInHalfOpenState: 5
        minimumNumberOfCalls: 5
        recordExceptions:
          - java.lang.RuntimeException
