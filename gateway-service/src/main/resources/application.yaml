spring:
  application:
    name: gateway-service
  discovery:
    locator:
      enabled: true
      lower-case-service-id: true
  cloud:
    gateway:
      routes:
        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/users/**

        - id: user-service
          uri: lb://user-service
          predicates:
            - Path=/api/v1/auth/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/api/v1/hubs/**

        - id: hub-service
          uri: lb://hub-service
          predicates:
            - Path=/api/v1/transfers/**

        - id: company-product-service
          uri: lb://company-product-service
          predicates:
            - Path=/api/v1/companies/**

        - id: company-product-service
          uri: lb://company-product-service
          predicates:
            - Path=/api/v1/products/**

        - id: order-delivery-service
          uri: lb://order-delivery-service
          predicates:
            - Path=/api/v1/orders

        - id: order-delivery-service
          uri: lb://order-delivery-service
          predicates:
            - Path=/api/v1/deliveries/**

        - id: order-delivery-service
          uri: lb://order-delivery-service
          predicates:
            - Path=/api/v1/delivery-routes/**

        - id: order-delivery-service
          uri: lb://order-delivery-service
          predicates:
            - Path=/api/v1/delivery-managers/**

        - id: slack-ai-service
          uri: lb://slack-ai-service
          predicates:
            - Path=/api/v1/slack-messages/**

        - id: slack-ai-service
          uri: lb://slack-ai-service
          predicates:
            - Path=/api/v1/ai-messages/**

server:
  port: 19010

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:19090}/eureka/
    register-with-eureka: true
    fetch-registry: true
