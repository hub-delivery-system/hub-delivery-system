spring:
  application:
    name: gateway-service
  security:
    oauth2:
      resourceserver:
        jwt:
          # TODO: Docker Compose 작성 시 keycloak 컨테이너 주소로 변경
          #   실제값: http://keycloak:8080/realms/{realm명}/protocol/openid-connect/certs
          #   KEYCLOAK_JWK_SET_URI 환경변수로 docker-compose.yml에서 주입
          jwk-set-uri: "${KEYCLOAK_JWK_SET_URI:http://localhost:8080/realms/hub-delivery/protocol/openid-connect/certs}"
  discovery:
    locator:
      enabled: true
      lower-case-service-id: true
  cloud:
    gateway:
      httpclient:
        connect-timeout: 2000
        response-timeout: 10s
      routes:
        - id: user-service-users
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/users/**

        - id: user-service-auth
          uri: lb://USER-SERVICE
          predicates:
            - Path=/api/v1/auth/**

        - id: user-service-docs
          uri: lb://USER-SERVICE
          predicates:
            - Path=/user-service/v3/api-docs

        - id: hub-service-hubs
          uri: lb://HUB-SERVICE
          predicates:
            - Path=/api/v1/hubs/**

        - id: hub-service-transfers
          uri: lb://HUB-SERVICE
          predicates:
            - Path=/api/v1/transfers/**

        - id: hub-service-docs
          uri: lb://HUB-SERVICE
          predicates:
            - Path=/hub-service/v3/api-docs

        - id: company-product-service-companies
          uri: lb://COMPANY-PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/companies/**

        - id: company-product-service-products
          uri: lb://COMPANY-PRODUCT-SERVICE
          predicates:
            - Path=/api/v1/products/**

        - id: company-product-service-docs
          uri: lb://COMPANY-PRODUCT-SERVICE
          predicates:
            - Path=/company-product-service/v3/api-docs

        - id: order-service-orders
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/api/v1/orders/**

        - id: order-service-docs
          uri: lb://ORDER-SERVICE
          predicates:
            - Path=/order-service/v3/api-docs

        - id: delivery-service-deliveries
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/deliveries/**

        - id: delivery-service-routes
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/delivery-routes/**

        - id: delivery-service-managers
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/api/v1/delivery-managers/**

        - id: delivery-service-docs
          uri: lb://DELIVERY-SERVICE
          predicates:
            - Path=/delivery-service/v3/api-docs

        - id: slack-ai-service-slack
          uri: lb://SLACK-AI-SERVICE
          predicates:
            - Path=/api/v1/slack-messages/**

        - id: slack-ai-service-ai
          uri: lb://SLACK-AI-SERVICE
          predicates:
            - Path=/api/v1/ai-messages/**

        - id: slack-ai-service-docs
          uri: lb://SLACK-AI-SERVICE
          predicates:
            - Path=/slack-ai-service/v3/api-docs

server:
  port: 19010

eureka:
  client:
    service-url:
      defaultZone: http://${EUREKA_HOST:localhost}:${EUREKA_PORT:19090}/eureka/
    register-with-eureka: true
    fetch-registry: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: user-service
        url: /user-service/v3/api-docs

      - name: hub-service
        url: /hub-service/v3/api-docs

      - name: company-product-service
        url: /company-product-service/v3/api-docs

      - name: order-service
        url: /order-service/v3/api-docs

      - name: delivery-service
        url: /delivery-service/v3/api-docs

      - name: slack-ai-service
        url: /slack-ai-service/v3/api-docs

logging:
  pattern:
    level: "%5p [${spring.application.name:}, traceId=%X{traceId:-}, spanId=%X{spanId:-}]"

# TODO: 운영 환경에 맞게 조정 필요
management:
  tracing:
    enabled: true
    sampling:
      probability: 1.0  # 임시 전체 샘플링 - 운영 시 0.1 수준으로 낮출 것
  zipkin:
    tracing:
      enabled: false  # Zipkin 미구성 환경에서 임시 비활성화 - 운영 시 활성화 및 endpoint 설정 필요